<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APM — Ferramentas | Área de Membros</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.111.0/dist/umd/supabase.min.js"></script>
<style>
:root{
  --navy:#0F0F0F;--navy-light:#1A1A1A;--navy-mid:#242424;--navy-deep:#0F0F0F;
  --accent:#C9A84C;--accent-light:#E8C97A;
  --text-primary:#E8E8E8;--text-secondary:#AAAAAA;--text-muted:#888888;
  --verde:#22c55e;--amarelo:#eab308;--laranja:#f97316;--vermelho:#ef4444;--azul:#3b82f6;
  --bd:#2a2a2a;--sidebar-w:232px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--navy);color:var(--text-primary);font-family:'Inter',-apple-system,sans-serif;-webkit-font-smoothing:antialiased;font-size:14px}
.app{display:flex;height:100vh;overflow:hidden}
button,input,select,textarea{font-family:inherit}

/* SIDEBAR */
.sidebar{width:var(--sidebar-w);background:var(--navy-deep);border-right:1px solid #222;display:flex;flex-direction:column;flex-shrink:0}
.sb-brand{padding:16px 14px;border-bottom:1px solid #222;display:flex;align-items:center;gap:10px}
.sb-icon{width:34px;height:34px;background:var(--accent);border-radius:4px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;color:var(--navy);flex-shrink:0}
.sb-name{font-weight:700;font-size:22px;letter-spacing:3px;text-transform:uppercase;color:#fff;line-height:1}
.sb-sub{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-muted);margin-top:3px}
.sb-nav{flex:1;padding:12px 10px;overflow-y:auto}
.nav-sec{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--text-muted);padding:0 8px;margin:14px 0 5px}
.nav-sec:first-child{margin-top:0}
.nav-it{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:4px;cursor:pointer;font-size:13px;font-weight:500;color:var(--text-muted);transition:all .15s;margin-bottom:2px;position:relative}
.nav-it:hover{background:rgba(255,255,255,.04);color:var(--text-secondary)}
.nav-it.on{background:rgba(201,168,76,.09);color:var(--accent-light)}
.nav-it.on::before{content:'';position:absolute;left:0;top:25%;height:50%;width:3px;background:var(--accent);border-radius:0 2px 2px 0}
.nav-ic{width:16px;text-align:center;flex-shrink:0;font-size:13px}
.nav-bg{margin-left:auto;font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;background:rgba(201,168,76,.12);color:var(--accent)}
.nav-bg.red{background:rgba(239,68,68,.14);color:#fca5a5}
.sb-foot{padding:12px 16px;border-top:1px solid #222;font-size:10px;color:var(--text-muted);line-height:1.6}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:56px;padding:0 26px;border-bottom:1px solid #222;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;background:var(--navy-deep)}
.tb-t{font-size:15px;font-weight:600}
.tb-s{font-size:11px;color:var(--text-muted);margin-top:2px}
.tbr{display:flex;gap:8px;align-items:center}
.content{flex:1;overflow-y:auto;padding:24px 26px 60px}
.view{display:none}.view.on{display:block}

/* UI */
.btn{background:transparent;border:1px solid rgba(255,255,255,.12);color:var(--text-secondary);padding:7px 13px;border-radius:4px;font-size:12px;font-weight:500;cursor:pointer;transition:all .15s}
.btn:hover{border-color:rgba(255,255,255,.26);color:var(--text-primary)}
.btn.gold{background:var(--accent);color:#111;border:none;font-weight:700;letter-spacing:.5px}
.btn.gold:hover{background:var(--accent-light)}
.btn.sm{padding:4px 9px;font-size:11px}
.btn.dg{border-color:rgba(239,68,68,.3);color:#fca5a5}
.btn.dg:hover{border-color:var(--vermelho);color:#fff;background:rgba(239,68,68,.15)}

.card{background:var(--navy-light);border:1px solid var(--bd);border-radius:8px;padding:18px;margin-bottom:16px}
.card h3{font-size:12px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--accent);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.card h3 .hint{margin-left:auto;font-size:10px;font-weight:400;letter-spacing:0;text-transform:none;color:var(--text-muted)}
.sub{font-size:12px;color:var(--text-muted);margin:-8px 0 14px;line-height:1.6}

.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}.g5{grid-template-columns:repeat(5,1fr)}
@media(max-width:1180px){.g4,.g5{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}

.f{display:flex;flex-direction:column;gap:5px}
.f label{font-size:10px;letter-spacing:.8px;text-transform:uppercase;color:var(--text-muted);font-weight:600}
.f input,.f select,.f textarea{background:#111;border:1px solid var(--bd);border-radius:5px;padding:8px 10px;color:var(--text-primary);font-size:13px;width:100%;outline:none;transition:border-color .15s}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--accent)}
.f input::placeholder{color:#555}
.f .u{font-size:10px;color:var(--text-muted)}
input[type=date]{color-scheme:dark}

/* KPI TILES */
.kpis{display:grid;gap:12px;grid-template-columns:repeat(4,1fr)}
@media(max-width:1180px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--navy-light);border:1px solid var(--bd);border-radius:8px;padding:14px 16px;position:relative;overflow:hidden}
.kpi .l{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--text-muted);font-weight:600}
.kpi .v{font-size:24px;font-weight:700;margin-top:6px;line-height:1.1}
.kpi .d{font-size:11px;color:var(--text-muted);margin-top:4px}
.kpi.ok{border-left:3px solid var(--verde)}.kpi.warn{border-left:3px solid var(--amarelo)}
.kpi.bad{border-left:3px solid var(--vermelho)}.kpi.neu{border-left:3px solid var(--accent)}

/* TABLE */
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-size:10px;letter-spacing:.8px;text-transform:uppercase;color:var(--text-muted);font-weight:600;padding:8px 9px;border-bottom:1px solid var(--bd);white-space:nowrap}
td{padding:8px 9px;border-bottom:1px solid #1f1f1f;vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:rgba(255,255,255,.02)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto}
table input,table select{background:#111;border:1px solid #2a2a2a;border-radius:4px;padding:5px 7px;color:var(--text-primary);font-size:12px;width:100%;outline:none}
table input:focus,table select:focus{border-color:var(--accent)}

/* MISC */
.tag{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;padding:3px 8px;border-radius:4px;white-space:nowrap}
.t-verde{background:rgba(34,197,94,.13);color:#4ade80}
.t-amarelo{background:rgba(234,179,8,.13);color:#facc15}
.t-laranja{background:rgba(249,115,22,.14);color:#fb923c}
.t-vermelho{background:rgba(239,68,68,.14);color:#f87171}
.t-neu{background:rgba(255,255,255,.06);color:var(--text-secondary)}
.t-gold{background:rgba(201,168,76,.13);color:var(--accent-light)}

.bar{height:6px;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;border-radius:3px}
.dual{position:relative;height:22px}
.dual .plan{position:absolute;top:4px;left:0;height:5px;background:rgba(255,255,255,.16);border-radius:3px}
.dual .real{position:absolute;top:11px;left:0;height:5px;border-radius:3px}

.alert{display:flex;gap:11px;align-items:flex-start;padding:11px 13px;border-radius:6px;margin-bottom:8px;font-size:13px;line-height:1.5;border:1px solid}
.alert b{font-weight:600}
.a-red{background:rgba(239,68,68,.07);border-color:rgba(239,68,68,.25)}
.a-org{background:rgba(249,115,22,.07);border-color:rgba(249,115,22,.25)}
.a-yel{background:rgba(234,179,8,.06);border-color:rgba(234,179,8,.22)}
.a-grn{background:rgba(34,197,94,.06);border-color:rgba(34,197,94,.22)}
.a-blu{background:rgba(59,130,246,.06);border-color:rgba(59,130,246,.22)}
.alert .ic{font-size:15px;line-height:1.2;flex-shrink:0}

.empty{padding:26px;text-align:center;color:var(--text-muted);font-size:13px;border:1px dashed var(--bd);border-radius:6px}
.dre{font-size:13px}
.dre .r{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #1f1f1f}
.dre .r.tot{font-weight:700;border-bottom:1px solid var(--bd);border-top:1px solid var(--bd);margin-top:2px;color:var(--accent-light)}
.dre .r.ind{padding-left:16px;color:var(--text-secondary)}
.dre .r span:last-child{font-variant-numeric:tabular-nums}

.kb{display:flex;gap:10px;overflow-x:auto;padding-bottom:10px}
.kb-col{min-width:174px;flex:1;background:#151515;border:1px solid var(--bd);border-radius:7px;display:flex;flex-direction:column}
.kb-h{padding:9px 10px;border-bottom:1px solid var(--bd);font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--text-secondary);line-height:1.4}
.kb-h .c{float:right;background:rgba(255,255,255,.07);border-radius:9px;padding:0 6px;font-size:10px}
.kb-b{padding:8px;display:flex;flex-direction:column;gap:7px;min-height:70px}
.kb-c{background:var(--navy-light);border:1px solid var(--bd);border-radius:5px;padding:8px 9px;font-size:12px;border-left:3px solid var(--accent)}
.kb-c .t{font-weight:600;margin-bottom:3px}
.kb-c .m{font-size:10.5px;color:var(--text-muted)}

.chk-row{display:grid;grid-template-columns:26px 1fr 148px 132px;gap:9px;align-items:center;padding:8px 0;border-bottom:1px solid #1f1f1f;font-size:12.5px}
.chk-row .num{color:var(--text-muted);font-size:11px}
.chk-row.done{opacity:.55}
.seg{display:inline-flex;border:1px solid var(--bd);border-radius:5px;overflow:hidden}
.seg button{background:#111;border:none;color:var(--text-muted);font-size:11px;padding:5px 9px;cursor:pointer;border-right:1px solid var(--bd)}
.seg button:last-child{border-right:none}
.seg button.on.ok{background:rgba(34,197,94,.2);color:#4ade80}
.seg button.on.no{background:rgba(239,68,68,.2);color:#f87171}
.seg button.on.na{background:rgba(255,255,255,.1);color:var(--text-primary)}

.note{font-size:11.5px;color:var(--text-muted);line-height:1.65;border-left:2px solid var(--bd);padding-left:11px;margin-top:12px}
.row{display:flex;gap:9px;align-items:flex-end;flex-wrap:wrap}
.sp{flex:1}
h4{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--text-secondary);margin:18px 0 9px;font-weight:600}
h4:first-child{margin-top:0}
.mini{font-size:11px;color:var(--text-muted)}
.ck{width:16px;height:16px;accent-color:var(--accent);cursor:pointer}

/* LOGIN */
.gate{position:fixed;inset:0;background:var(--navy);display:flex;align-items:center;justify-content:center;z-index:100;padding:24px}
.gate-box{width:100%;max-width:390px}
.gate-brand{display:flex;align-items:center;gap:12px;margin-bottom:28px}
.gate-brand .sb-icon{width:42px;height:42px;font-size:19px}
.gate h1{font-size:20px;font-weight:600;margin-bottom:6px}
.gate p{font-size:13px;color:var(--text-muted);line-height:1.65;margin-bottom:20px}
.gate .f{margin-bottom:12px}
.gate .btn{width:100%;padding:11px;justify-content:center;text-align:center;font-size:13px}
.gate-msg{margin-top:16px}
/* Parede de quem nao comprou o app. Precisa de mais largura que a caixa
   de login: aqui nao ha um campo, ha uma vitrine com os 10 modulos. */
.gate-box.venda{max-width:600px}
.gate .vmods{margin:18px 0 22px}
.gate .vlk{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.03);border:1px dashed rgba(201,168,76,.3);color:var(--text-secondary);font-size:11px;padding:5px 10px;border-radius:4px;margin:0 5px 5px 0}
.gate .vb{display:inline-flex;align-items:center;justify-content:center;gap:6px;width:100%;background:var(--accent);color:var(--navy);border:none;padding:12px;border-radius:4px;font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;cursor:pointer;text-decoration:none;margin-bottom:10px}
.gate .vb:hover{filter:brightness(1.12)}
.sync{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--text-muted);margin-top:4px}
.sync i{width:6px;height:6px;border-radius:50%;background:var(--text-muted);display:block;flex-shrink:0}
.sync.ok i{background:var(--verde)}.sync.bad i{background:var(--vermelho)}.sync.wait i{background:var(--amarelo)}
.sb-foot .u{font-size:11px;color:var(--text-secondary);word-break:break-all;line-height:1.4}
.linkbtn{background:none;border:none;color:var(--text-muted);font-size:10px;cursor:pointer;padding:0;text-decoration:underline;margin-top:6px}
.linkbtn:hover{color:var(--accent-light)}

/* ---- MODO VITRINE ----
   O app aberto para quem ainda nao comprou: ele ve os dez modulos
   funcionando com dados de exemplo e nao consegue lancar nada.
   O campo continua legivel de proposito — apagar esconde justamente o
   que precisa ser desejado. O que muda e' o cursor e a interacao. */
.vitfx{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:linear-gradient(135deg,rgba(201,168,76,.12),rgba(201,168,76,.03));border-bottom:1px solid rgba(201,168,76,.34);padding:13px 26px}
.vitfx-t{font-size:12.5px;font-weight:700;color:var(--accent-light);letter-spacing:.3px}
.vitfx-s{font-size:11.5px;color:var(--text-secondary);line-height:1.5;flex:1;min-width:220px}
.vitfx .vb{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:var(--navy);border:none;padding:9px 17px;border-radius:4px;font-size:10.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;cursor:pointer;text-decoration:none;white-space:nowrap}
.vitfx .vb:hover{filter:brightness(1.12)}
body.vit #content input,body.vit #content select,body.vit #content textarea{cursor:not-allowed;opacity:.8}
body.vit #content button:not([data-vitrine-livre]){cursor:not-allowed;opacity:.7}
.vittoast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:900;display:flex;align-items:center;gap:13px;background:var(--navy-light,#141d31);border:1px solid rgba(201,168,76,.42);border-radius:6px;padding:12px 16px;box-shadow:0 10px 34px rgba(0,0,0,.5);max-width:min(560px,92vw)}
.vittoast div{font-size:12px;color:var(--text-secondary);line-height:1.5}
.vittoast a{color:var(--navy);background:var(--accent);text-decoration:none;font-size:10.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;padding:8px 14px;border-radius:4px;white-space:nowrap}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="sb-brand">
      <div class="sb-icon">A</div>
      <div><div class="sb-name">APM</div><div class="sb-sub">Ferramentas</div></div>
    </div>
    <nav class="sb-nav" id="nav"></nav>
    <div class="sb-foot" id="sbfoot"></div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div><div class="tb-t" id="vt">Painel Executivo</div><div class="tb-s" id="vs"></div></div>
      <div class="tbr">
        <span id="undo"></span>
        <button class="btn sm" onclick="seed()">Dados de exemplo</button>
        <button class="btn sm" onclick="exportar()">Exportar</button>
        <button class="btn sm" onclick="$('#imp').click()">Importar</button>
        <input type="file" id="imp" accept="application/json" style="display:none" onchange="importar(this)">
      </div>
    </div>
    <div class="content" id="content"></div>
  </main>
</div>

<script>
/* ══════════════════════════════════════════════════════════════
   CONFIGURAÇÃO — preencha com os dados do seu projeto Supabase.
   Onde achar: painel do Supabase → Project Settings → API.
   A chave "anon" é pública por design; a segurança vem do RLS
   (a política SQL que só deixa cada usuário ler a própria linha).
   Deixando os dois campos vazios, o app roda em modo local,
   salvando só no navegador e sem exigir login.
   ══════════════════════════════════════════════════════════════ */
const CFG={
  url : 'https://frqoxmerrfucprtgvghm.supabase.co',
  anon: 'sb_publishable_RqQh3AFRXdYPvElZglLCHA_76PbkpmG'   // chave PUBLICAVEL, nunca a sb_secret_
};

/* ══════════ HELPERS ══════════ */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const brl=n=>(!isFinite(n))?'—':n.toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});
const brl2=n=>(!isFinite(n))?'—':n.toLocaleString('pt-BR',{style:'currency',currency:'BRL',minimumFractionDigits:2,maximumFractionDigits:2});
const pc=(n,d=1)=>(!isFinite(n))?'—':(n*100).toFixed(d).replace('.',',')+'%';
const nf=(n,d=0)=>(!isFinite(n))?'—':n.toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
/* Fracao -> texto do campo de porcentagem. Sem arredondar, 0.28*100 vira
   28.000000000000004 em ponto flutuante e aparece assim na tela. */
const pctIn=v=>String(Math.round(num(v)*1e6)/1e4).replace('.',',');
function num(v){if(typeof v==='number')return v;if(v==null||v==='')return 0;let s=String(v).replace(/[^\d,.-]/g,'');if(s.indexOf(',')>-1)s=s.replace(/\./g,'').replace(',','.');return parseFloat(s)||0}
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const hoje=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const dt=iso=>iso?new Date(iso+'T12:00:00'):null;
const fmtD=iso=>iso?iso.slice(8,10)+'/'+iso.slice(5,7):'—';
const isoOf=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
function addBiz(iso,n){const d=dt(iso);const st=n<0?-1:1,t=Math.abs(n);let c=0;while(c<t){d.setDate(d.getDate()+st);const w=d.getDay();if(w!==0&&w!==6)c++}return isoOf(d)}
function bizBetween(a,b){if(!a||!b)return 0;let s=dt(a),e=dt(b),sig=1;if(s>e){[s,e]=[e,s];sig=-1}let c=0;const d=new Date(s);while(d<e){d.setDate(d.getDate()+1);const w=d.getDay();if(w!==0&&w!==6)c++}return c*sig}
const dias=(a,b)=>(!a||!b)?0:Math.round((dt(b)-dt(a))/864e5);

/* ══════════ CONSTANTES ══════════ */
const MARCOS=[
 {k:'F25',lbl:'Fábrica 25%',crit:'Material do ambiente comprado e em pátio',short:'Material em pátio',off:12,fase:'Fábrica'},
 {k:'F50',lbl:'Fábrica 50%',crit:'Corte e usinagem concluídos',short:'Corte / usinagem',off:20,fase:'Fábrica',chk:'corte'},
 {k:'F75',lbl:'Fábrica 75%',crit:'Pré-montagem finalizada',short:'Pré-montagem',off:27,fase:'Fábrica',chk:'premont'},
 {k:'F100',lbl:'Fábrica 100%',crit:'Embalado — pronto para expedir',short:'Embalado',off:34,fase:'Fábrica',chk:'exped'},
 {k:'O25',lbl:'Obra 25%',crit:'Material in loco (recebido na obra)',short:'In loco',off:36,fase:'Obra'},
 {k:'O50',lbl:'Obra 50%',crit:'Montagem concluída',short:'Montado',off:45,fase:'Obra'},
 {k:'O75',lbl:'Obra 75%',crit:'Ajustes e acabamentos prontos',short:'Ajustado',off:51,fase:'Obra'},
 {k:'O100',lbl:'Obra 100%',crit:'Limpo e entregue ao cliente',short:'Entregue',off:55,fase:'Obra',chk:'instal'}
];
const CHECKLISTS={
 corte:{nome:'Corte',emoji:'✂️',marco:'Fábrica 25% → 50%',itens:[
  'Medidas do caderno técnico conferidas peça a peça antes de cortar',
  'Material corresponde à especificação (cor/textura/espessura) do caderno',

/* ══════════ CÁLCULOS: CENTRO DE CUSTO ══════════ */
/* O custo fixo não se dilui por "projeto médio" — se dilui por tempo de ocupação da
   fábrica. Pool mensal ÷ capacidade (dias × frentes simultâneas × ocupação) = custo
   por dia-frente. Multiplicado pelos dias que o projeto ocupa, vira o indireto real. */
function calcCC(){
 const cc=DB.cc||{}, f=DB.fin;
 const cfMes = cc.fonte==='manual' ? num(cc.poolManual) : f.cf.reduce((a,b)=>a+num(b),0);
 const moMes = cc.moCap ? num(f.cv[1]) : 0;
 const pool  = cfMes+moMes;
 const base  = cc.base==='corridos' ? 30 : num(cc.diasUteis);
 const cap   = base*num(cc.frentes)*num(cc.ocup);
 const cdf   = cap>0 ? pool/cap : NaN;
 const dias  = num(cc.dias);
 const rateio= isFinite(cdf) ? cdf*dias : NaN;
 return{cfMes,moMes,pool,base,cap,cdf,dias,rateio,valido:pool>0&&cap>0&&dias>0};
}
/* Fonte única do custo fixo por projeto: rateio medido, ou o valor manual se o
   centro de custo estiver desligado / sem dado suficiente. */
function ccAtivo(){return !!(DB.cc&&DB.cc.on)&&calcCC().valido}
function cfixAtual(){return ccAtivo()?calcCC().rateio:num(DB.prec.cfix)}
/* Mão de obra direta só sai do preço por m² quando ela foi movida para o pool de
   capacidade — senão seria cobrada duas vezes. */
function moUnit(){return (ccAtivo()&&DB.cc.moCap)?0:num(DB.prec.mo)}

/* ══════════ CÁLCULOS: SIMULADOR ══════════ */
/* Independente do resto do app: nada aqui le fin/prec/cc nem escreve neles.
   Capacidade sai de m² por pessoa MEDIDO sobre o que foi entregue, nao de
   ocupacao estimada. Isso e proposital: a produtividade historica ja carrega
   dentro dela a falta de material, o retrabalho, a quebra e a gente parada.
   Aplicar um fator de ocupacao em cima contaria a ociosidade duas vezes.
   Fabrica e montagem sao capacidades separadas, e o que a empresa entrega e a
   MENOR das duas — obra embalada no patio nao e obra entregue. */
function calcSim(c){
 /* ---------- ETAPA 1: base de custo, sem nenhuma referencia a preco ---------- */
 const pf=num(c.pessoasFab), pm=num(c.pessoasMon), P=pf+pm;
 const capFab = pf*num(c.prodFab);
 const capMon = pm*num(c.prodMon);
 const capEnt = Math.min(capFab,capMon);                   // m² entregues por mes
 const gargalo = capFab===capMon ? 'equilibrado' : (capFab<capMon ? 'fábrica' : 'montagem');
 const ocioso = Math.abs(capFab-capMon);
 const prodPessoa = P>0 ? capEnt/P : NaN;                  // m² entregues por pessoa/mes
 const folha = P*num(c.custoPessoa);                       // mao de obra direta, quase-fixa
 const fixoEstrut = num(c.fixos)+num(c.variaveis);
 const estrutura = folha+fixoEstrut;                       // tudo que corre todo mes
 const estrutM2 = capEnt>0 ? estrutura/capEnt : NaN;       // estrutura diluida no m²
 const mobM2 = capEnt>0 ? folha/capEnt : NaN;              // mao de obra direta por m²
 const matM2 = num(c.matM2);                               // material por m², custo variavel
 const custoM2 = estrutM2+matM2;                           // PISO ABSOLUTO do m², sem imposto nem lucro

 /* ---------- ETAPA 2: margens — so aqui o preco entra ---------- */
 const preco = num(c.precoM2);
 const impM2 = preco*num(c.imp), comM2 = preco*num(c.com);
 const varM2 = matM2+impM2+comM2;                          // o que varia com cada m² vendido
 const mcM2  = preco-varM2;                                // margem de contribuicao por m²
 const mcPct = preco>0 ? mcM2/preco : NaN;
 const mbM2  = preco-matM2-mobM2;                          // margem bruta: tira material e MOD
 const mbPct = preco>0 ? mbM2/preco : NaN;
 /* equilibrio: a contribuicao de cada m² precisa cobrir a estrutura inteira.
    A folha entra como fixa de proposito — marceneiro e salario mensal, nao cai
    porque o mes foi fraco. Sem preco, esta conta nao existe. */
 const peM2 = mcM2>0 ? estrutura/mcM2 : NaN;               // m² para empatar
 const pePessoa = (P>0&&isFinite(peM2)) ? peM2/P : NaN;    // m² que cada um precisa produzir
 const peReceita = isFinite(peM2) ? peM2*preco : NaN;
 /* A meta e o mesmo calculo do equilibrio com o lucro desejado somado a estrutura.
    Meta de lucro zero devolve exatamente o ponto de equilibrio — sao a mesma conta. */
 const meta = num(c.metaLucro);
 const metaM2 = mcM2>0 ? (estrutura+meta)/mcM2 : NaN;
 const metaPessoa = (P>0&&isFinite(metaM2)) ? metaM2/P : NaN;
 const metaReceita = isFinite(metaM2) ? metaM2*preco : NaN;
 const metaFolga = (isFinite(metaM2)&&isFinite(capEnt)) ? capEnt-metaM2 : NaN;
 const precoMin = mcM2>0||preco>0 ? (num(c.imp)+num(c.com)<1 ? custoM2/(1-num(c.imp)-num(c.com)) : NaN) : NaN;

 /* ---------- ETAPA 3: resultado no volume entregue ---------- */
 const vol = num(c.volume);
 const receita = vol*preco;
 const mcTotal = vol*mcM2;
 const lucro = mcTotal-estrutura;
 const mlPct = receita>0 ? lucro/receita : NaN;
 const fatPessoa = P>0 ? receita*12/P : NaN;
 return{pf,pm,P,capFab,capMon,capEnt,gargalo,ocioso,prodPessoa,
        folha,fixoEstrut,estrutura,estrutM2,mobM2,matM2,custoM2,
        preco,impM2,comM2,varM2,mcM2,mcPct,mbM2,mbPct,peM2,pePessoa,peReceita,precoMin,
        meta,metaM2,metaPessoa,metaReceita,metaFolga,
        vol,receita,mcTotal,lucro,mlPct,fatPessoa,
        folgaCap: isFinite(capEnt)?capEnt-vol:NaN,
        folgaPE:  isFinite(peM2)?vol-peM2:NaN};
}

/* ══════════ CÁLCULOS: PRECIFICAÇÃO ══════════ */
/* Imposto e comissão incidem sobre o PREÇO, não sobre o custo. Por isso os três
   percentuais entram juntos no divisor: custo ÷ (1 − imposto − comissão − margem).
   Multiplicar o custo por (1+margem) devolveria uma margem que o imposto come. */
function calcPreco(m2,matIdx,cx,margem,matMult){
 const p=DB.prec, custoMat=(p.mats[matIdx]||p.mats[0]||{c:0}).c*(matMult||1);
 const m2r=m2*p.conv, bruto=m2r*custoMat, perda=bruto*p.perda, matReal=bruto+perda;
 const mo=m2r*moUnit()*cx, cfix=cfixAtual(), total=matReal+mo+cfix;
 const imp=num(DB.fin.imposto), com=num(p.comissao), carga=imp+com+margem;
 const preco=carga<1?total/(1-carga):NaN;
 const vImp=preco*imp, vCom=preco*com, lucro=preco*margem;
 return{m2r,bruto,perda,matReal,mo,cfix,total,imp,com,carga,preco,
        pm2:m2?preco/m2:NaN,vImp,vCom,lucro,markup:total?preco/total:NaN};
}

function alertas(){
 const A=[],f=calcFin(),fu=funil(),sd=saldos();
 DB.amb.forEach(a=>{const s=ambStatus(a);if(s.done)return;
  if(s.cor==='vermelho')A.push({lvl:'red',t:`${a.projeto} — ${a.ambiente}`,m:`${nf(-s.desvio,0)} pontos atrás do planejado. Ambiente em vermelho: trava o projeto inteiro.`});
  else if(s.cor==='laranja')A.push({lvl:'org',t:`${a.projeto} — ${a.ambiente}`,m:`${nf(-s.desvio,0)} pontos atrás do planejado.`});
  const d=diasNaEtapa(a);
  if(d>10&&s.cor!=='vermelho')A.push({lvl:'yel',t:`${a.projeto} — ${a.ambiente} parado`,m:`${d} dias em "${etapaNome(a)}". Cruze com o Kanban e o PCP.`});
 });
 sd.filter(m=>m.st==='CRÍTICO').forEach(m=>A.push({lvl:'red',t:`Estoque: ${m.nome}`,m:`Saldo ${nf(m.saldo,0)} ${m.un} contra mínimo ${nf(m.min,0)}. Lead time ${m.lead} dias — pedir hoje.`}));
 if(fu.atrasados.length)A.push({lvl:'org',t:`${fu.atrasados.length} follow-up(s) atrasado(s)`,m:fu.atrasados.map(l=>l.lead).join(', ')});
 if(fu.hoje.length)A.push({lvl:'blu',t:`${fu.hoje.length} follow-up(s) para hoje`,m:fu.hoje.map(l=>l.lead).join(', ')});
 if(isFinite(f.llp)&&f.fatM>0){
  if(f.llp<0)A.push({lvl:'red',t:'Prejuízo operacional',m:`Margem líquida ${pc(f.llp)}. Você está pagando para produzir.`});
  else if(f.llp<0.10)A.push({lvl:'org',t:'Margem líquida abaixo de 10%',m:`${pc(f.llp)} não sustenta reinvestimento nem imprevisto.`});
 }
 if(isFinite(f.pe)&&f.fatM>0&&f.pe>f.fatM)A.push({lvl:'red',t:'Faturamento abaixo do ponto de equilíbrio',m:`Precisa faturar ${brl(f.pe)}/mês só para empatar. Está em ${brl(f.fatM)}.`});
 if(isFinite(f.cfp)&&f.cfp>0.22)A.push({lvl:'yel',t:'Custo fixo alto',m:`${pc(f.cfp)} do faturamento. Ideal 15–20%.`});
 return A;
}

PAINT.painel=()=>{

 const A=alertas();
 const tile=(l,v,d,c)=>`<div class="kpi ${c||'neu'}"><div class="l">${l}</div><div class="v">${v}</div><div class="d">${d}</div></div>`;
 const cls=(ok,warn)=>ok?'ok':warn?'warn':'bad';
 $('#out').innerHTML=`

  ${tile('Ponto de equilíbrio',brl(f.pe),isFinite(f.pe)&&f.fatM?(f.fatM>=f.pe?`Folga de ${brl(f.fatM-f.pe)}/mês`:`Falta ${brl(f.pe-f.fatM)}/mês`):'—',isFinite(f.pe)&&f.fatM?cls(f.fatM>=f.pe*1.15,f.fatM>=f.pe):'neu')}
  ${tile('Lucro líquido/mês',brl(f.ll),`Margem contribuição ${pc(f.mcp)}`,isFinite(f.ll)?cls(f.ll>0,f.ll>=0):'neu')}
 </div>
 <div class="kpis" style="margin-bottom:16px">
  ${tile('Ticket médio',brl(fu.ticket),`${fu.fech} venda(s) fechada(s)`,'neu')}
  ${tile('Conversão lead → venda',pc(fu.cGeral),'Benchmark 15–25%',isFinite(fu.cGeral)?cls(fu.cGeral>=.15,fu.cGeral>=.10):'neu')}
  ${tile('Aderência ao cronograma',pc(ader),`${st.filter(s=>s.cor==='verde').length} de ${st.length} ambientes no verde`,isFinite(ader)?cls(ader>=.8,ader>=.6):'neu')}
  ${tile('Entrega no prazo',pc(prazo),`${entregues.length} ambiente(s) entregue(s)`,isFinite(prazo)?cls(prazo>=.9,prazo>=.8):'neu')}
 </div>
 <div class="kpis" style="margin-bottom:20px">
  ${tile('Ambientes em produção',nf(ativos.length),`${ps.length} projeto(s) ativos`,'neu')}
  ${tile('Valor em estoque',brl(estVal),`${crit} item(ns) abaixo do mínimo`,crit?'bad':'ok')}
  ${tile('Leads ativos',nf(DB.crm.filter(l=>!['Fechado','Perdido'].includes(l.status)).length),`${fu.atrasados.length} follow-up atrasado`,fu.atrasados.length?'warn':'neu')}
  ${tile('Custo fixo / faturamento',pc(f.cfp),'Ideal 15–20%',isFinite(f.cfp)&&f.fatM?cls(f.cfp<=.20,f.cfp<=.25):'neu')}
 </div>

 <div class="card">
  <h3>⚠️ O que exige ação hoje<span class="hint">${A.length} item(ns)</span></h3>
  ${A.length?A.map(a=>`<div class="alert a-${a.lvl}"><span class="ic">${a.lvl==='red'?'🔴':a.lvl==='org'?'🟠':a.lvl==='yel'?'🟡':'🔵'}</span><div><b>${esc(a.t)}</b><br><span style="color:var(--text-secondary)">${esc(a.m)}</span></div></div>`).join('')
  :'<div class="alert a-grn"><span class="ic">🟢</span><div><b>Nada crítico agora.</b><br><span style="color:var(--text-secondary)">Nenhum ambiente em atraso relevante, nenhum item de estoque abaixo do mínimo, nenhum follow-up vencido.</span></div></div>'}
 </div>

 <div class="grid g2">
  <div class="card">
   <h3>🚦 Projetos</h3>
   ${ps.length?`<div class="tw"><table><thead><tr><th>Projeto</th><th>Cliente</th><th class="n">Plan.</th><th class="n">Real</th><th>Status</th></tr></thead><tbody>
   ${ps.map(p=>`<tr><td><b>${esc(p.projeto)}</b><div class="mini">${p.ambientes.length} ambiente(s)</div></td><td>${esc(p.cliente||'—')}</td><td class="n">${nf(p.plan)}%</td><td class="n">${nf(p.real)}%</td><td><span class="tag t-${p.cor}">${p.cor}</span></td></tr>`).join('')}
   </tbody></table></div>`:'<div class="empty">Cadastre ambientes no módulo KPI 25/50/75/100.</div>'}
  </div>
  <div class="card">
   <h3>📈 Funil comercial</h3>
   ${DB.crm.length?[['Leads',fu.novos,1],['Visita agendada',fu.visita,fu.cLV],['Proposta enviada',fu.prop,fu.cVP],['Fechado',fu.fech,fu.cPF]].map(([l,v,c])=>`
    <div style="margin-bottom:11px"><div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px"><span>${l}</span><span><b>${v}</b> <span class="mini">${c===1?'':'· '+pc(c,0)}</span></span></div>

 </div>`;
};

PAINT.financeiro=()=>{

 if(!f.fatM){$('#out').innerHTML='<div class="card"><div class="empty">Lance o faturamento dos 3 meses para o diagnóstico aparecer.</div></div>';return}
 const r=(l,v,c)=>`<div class="r ${c||''}"><span>${l}</span><span>${brl(v)}</span></div>`;
 const cen=[['🔴 Pessimista (−10%)',f.fatM*.9,f.llp*.9],['🟡 Realista (média)',f.fatM,f.llp],['🟢 Otimista (+20%)',f.fatM*1.2,f.llp*1.1]];
 const diag=[];
 if(f.llp<0)diag.push(['red','Você está operando no prejuízo.',`Cada mês nesse ritmo consome ${brl(-f.ll)} de caixa. Não é problema de venda — é de estrutura de custo ou de preço.`]);
 else if(f.llp<0.10)diag.push(['org','Margem líquida abaixo de 10%.',`${pc(f.llp)} não paga imprevisto nem reinvestimento. Um mês ruim vira prejuízo.`]);
 else if(f.llp<0.15)diag.push(['yel','Margem apertada.',`${pc(f.llp)} está no limite. Alvo saudável: 15% a 25%.`]);
 else diag.push(['grn','Margem líquida saudável.',`${pc(f.llp)} está dentro da faixa alvo.`]);
 if(f.mcp<0.35)diag.push(['org','Margem de contribuição baixa.',`${pc(f.mcp)}. Abaixo de 35% significa preço mal calibrado ou perda técnica alta — o custo fixo não tem de onde sair.`]);
 if(f.cfp>0.22)diag.push(['yel','Custo fixo pesado.',`${pc(f.cfp)} do faturamento contra ideal de 15–20%. Diferença anual: ${brl((f.cfp-0.20)*f.fatM*12)}.`]);
 if(f.fatM<f.pe)diag.push(['red','Abaixo do ponto de equilíbrio.',`Faltam ${brl(f.pe-f.fatM)} de faturamento por mês só para empatar.`]);
 else diag.push(['grn','Acima do ponto de equilíbrio.',`Folga de ${brl(f.fatM-f.pe)}/mês, ou ${pc((f.fatM-f.pe)/f.fatM)} do faturamento.`]);
 const maior=sg[0];
 if(maior)diag.push(['blu','Maior sangria: '+maior.l,`${brl(maior.v)}/mês = ${pc(maior.p)} do faturamento. Cortar 10% aqui devolve ${brl(maior.v*.1*12)} por ano.`]);

 $('#out').innerHTML=`

  <div class="kpi ${f.fatM>=f.pe?'ok':'bad'}"><div class="l">Ponto de equilíbrio</div><div class="v">${brl(f.pe)}</div><div class="d">${f.fatM>=f.pe?'Folga de '+brl(f.fatM-f.pe):'Falta '+brl(f.pe-f.fatM)}</div></div>
  <div class="kpi ${f.cfp<=.20?'ok':'warn'}"><div class="l">Custo fixo / faturamento</div><div class="v">${pc(f.cfp)}</div><div class="d">${brl(f.cf)}/mês · ideal 15–20%</div></div>
 </div>

 <div class="grid g2">
  <div class="card"><h3>DRE gerencial<span class="hint">média mensal</span></h3><div class="dre">

   ${r('(−) Custos variáveis (CMV)',-f.cv,'ind')}
   ${r('(=) Margem de contribuição',f.mc,'tot')}
   <div class="r ind"><span>% margem de contribuição</span><span>${pc(f.mcp)}</span></div>
   ${r('(−) Custos fixos',-f.cf,'ind')}
   ${r('(=) LUCRO LÍQUIDO',f.ll,'tot')}

  </div>
  <div class="note">Ponto de equilíbrio calculado como custo fixo ÷ margem de contribuição sobre receita líquida, revertido para faturamento bruto pelo imposto. É o quanto você precisa vender para o lucro dar exatamente zero.</div>
  </div>

  <div class="card"><h3>🩸 Onde o dinheiro escorre<span class="hint">top 5</span></h3>
   <div class="tw"><table><thead><tr><th>Item</th><th>Tipo</th><th class="n">Mês</th><th class="n">% fat.</th><th class="n">Corte de 10%/ano</th></tr></thead><tbody>

 const cc=DB.cc, on=!!cc.on, man=cc.fonte==='manual';
 return `<div class="card">

   if(!cc.moCap&&num(DB.fin.cv[1])>0)A.push(['blu','Mão de obra ainda por m²',

VIEWS.simulador=()=>{
 const S=DB.sim;
 const linha=f=>{
  if(f.g)return `<tr><td colspan="3" style="padding:16px 6px 4px"><span style="font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--accent-light);font-weight:700">${f.g}</span></td></tr>`;
  const v=c=>f.t==='p'?pctIn(S[c][f.k]):S[c][f.k];
  const fn=f.t==='p'?'setpct':'setn';
  return `<tr>
   <td><div style="font-size:12.5px">${f.l}</div><div class="mini">${f.u}</div></td>
   <td><input value="${v('atual')}" oninput="${fn}('sim.atual.${f.k}',this)"></td>
   <td><input value="${v('simulado')}" oninput="${fn}('sim.simulado.${f.k}',this)"></td>
  </tr>`;
 };
 return `<div class="card">
  <h3>Cenários<span class="hint">nada aqui altera os outros módulos</span></h3>
  <div class="sub">A capacidade sai de <b>m² por pessoa medido sobre o que foi entregue</b> — não de ocupação estimada. Ocupação é chute e não existe aqui de propósito: a produtividade histórica já carrega dentro dela a falta de material, o retrabalho, a quebra de máquina e a gente parada. Aplicar um fator de ocupação em cima contaria a ociosidade duas vezes.<br><b>Fábrica e montagem são capacidades separadas, e o que a empresa entrega é a menor das duas.</b> Móvel embalado no pátio não é obra entregue.<br>Preencha à mão: este módulo não lê nem escreve nada dos outros. <b>Os números que já vêm nos campos são exemplo, não recomendação</b> — cada marcenaria tem o próprio custo de material, a própria produtividade e o próprio preço. Troque tudo pelos seus antes de decidir qualquer coisa.</div>
  <div class="tw"><table>
   <thead><tr><th>Variável</th><th class="n">Atual</th><th class="n">Simulado</th></tr></thead>
   <tbody>${SIM_CAMPOS.map(linha).join('')}</tbody>
  </table></div>
  <button class="btn" onclick="simCopiar()">Copiar Atual → Simulado</button>
 </div>
 <div id="outsim"></div>`;
};
function simCopiar(){DB.sim.simulado=Object.assign({},DB.sim.atual);save();render()}

PAINT.simulador=()=>{
 const el=$('#outsim'); if(!el)return;
 const a=DB.sim.atual, b=DB.sim.simulado, A=calcSim(a), B=calcSim(b);
 const fmt=(v,t)=>t==='r'?brl(v):t==='r2'?brl2(v):t==='p'?pc(v):nf(v,1);
 /* dir = +1 quando subir e bom (capacidade, lucro), -1 quando subir e ruim (custo,
    ponto de equilibrio). A cor segue o que e favoravel, nao o sinal da conta. */
 const delta=(x,y,t,dir)=>{
  if(!isFinite(x)||!isFinite(y))return '<span style="color:var(--text-muted)">—</span>';
  const d=y-x; if(Math.abs(d)<1e-9)return '<span style="color:var(--text-muted)">—</span>';
  const sinal=(d>0?'+':'−')+fmt(Math.abs(d),t);
  if(!dir)return `<span style="color:var(--text-secondary)">${sinal}</span>`; // sem direcao boa
  return `<span style="color:${d*dir>0?'var(--verde)':'var(--vermelho)'}">${sinal}</span>`;
 };
 const m2=(v)=>isFinite(v)?nf(v,1)+' m²':'—';
 /* Tres blocos, na ordem em que a conta se constroi: custo primeiro, preco depois,
    resultado por ultimo. O ponto de equilibrio mora no bloco 2 porque depende da
    margem de contribuicao, que depende do preco — nao ha como calcular antes. */
 const BLOCOS=[
  ['1 · Base de custo — sem falar de preço',[
   ['Capacidade da fábrica',A.capFab,B.capFab,'n',1],
   ['Capacidade da montagem',A.capMon,B.capMon,'n',1],
   ['Capacidade de entrega — a menor das duas',A.capEnt,B.capEnt,'n',1],
   ['Capacidade parada do outro lado',A.ocioso,B.ocioso,'n',-1],
   ['m² por pessoa/mês',A.prodPessoa,B.prodPessoa,'n',1],
   ['Folha da produção',A.folha,B.folha,'r',-1],
   ['Custos fixos + variáveis de estrutura',A.fixoEstrut,B.fixoEstrut,'r',-1],
   ['= Custo de estrutura por mês',A.estrutura,B.estrutura,'r',-1,1],
   ['Custo de estrutura por m²',A.estrutM2,B.estrutM2,'r2',-1],
   ['+ Custo direto do m² (material)',A.matM2,B.matM2,'r2',-1],
   ['= CUSTO TOTAL POR m² — piso absoluto',A.custoM2,B.custoM2,'r2',-1,1]
  ]],
  ['2 · Margens — aqui o preço entra',[
   ['Preço de venda por m²',A.preco,B.preco,'r',1],
   ['− Material por m²',A.matM2,B.matM2,'r2',-1],
   ['− Impostos por m²',A.impM2,B.impM2,'r2',-1],
   ['− Comissão por m²',A.comM2,B.comM2,'r2',-1],
   ['= Margem de contribuição por m²',A.mcM2,B.mcM2,'r2',1,1],
   ['Margem de contribuição',A.mcPct,B.mcPct,'p',1],
   ['Margem bruta — tirando material e mão de obra',A.mbPct,B.mbPct,'p',1],
   ['Preço mínimo por m² (cobre custo, imposto e comissão)',A.precoMin,B.precoMin,'r',-1],
   ['PONTO DE EQUILÍBRIO — m² por mês',A.peM2,B.peM2,'n',-1,1],
   ['— por funcionário',A.pePessoa,B.pePessoa,'n',-1],
   ['— em faturamento',A.peReceita,B.peReceita,'r',-1],
   ['Meta de lucro por mês',A.meta,B.meta,'r',0],
   ['META — m² por mês',A.metaM2,B.metaM2,'n',-1,1],
   ['— por funcionário',A.metaPessoa,B.metaPessoa,'n',-1],
   ['— em faturamento',A.metaReceita,B.metaReceita,'r',-1],
   ['Capacidade sobrando depois da meta',A.metaFolga,B.metaFolga,'n',1]
  ]],
  ['3 · Resultado no volume entregue',[
   ['m² entregues por mês',A.vol,B.vol,'n',1],
   ['Receita',A.receita,B.receita,'r',1],
   ['Margem de contribuição total',A.mcTotal,B.mcTotal,'r',1],
   ['− Custo de estrutura',A.estrutura,B.estrutura,'r',-1],
   ['= LUCRO',A.lucro,B.lucro,'r',1,1],
   ['Margem líquida',A.mlPct,B.mlPct,'p',1,1],
   ['Folga sobre o ponto de equilíbrio',A.folgaPE,B.folgaPE,'n',1],
   ['Capacidade de entrega ainda livre',A.folgaCap,B.folgaCap,'n',0],
   ['Faturamento por pessoa/ano',A.fatPessoa,B.fatPessoa,'r',1]
  ]]
 ];
 /* leitura em portugues do que a simulacao fez */
 const F=[], dP=B.P-A.P, dCusto=B.estrutura-A.estrutura, dLucro=B.lucro-A.lucro;
 /* o gargalo e a leitura mais importante: contratar do lado errado nao entrega nada */
 if(B.gargalo!=='equilibrado'&&B.ocioso>0.5){
  const lado=B.gargalo, outro=lado==='fábrica'?'montagem':'fábrica';
  F.push(['org','O gargalo é a '+lado,
   `A ${outro} dá conta de ${m2(lado==='fábrica'?B.capMon:B.capFab)}/mês, mas a ${lado} só entrega ${m2(B.capEnt)}. Sobram <b>${m2(B.ocioso)}</b> de capacidade que não viram entrega — e você paga por ela do mesmo jeito. Contratar na ${outro} não aumenta a entrega em 1 m²: só ampliar a ${lado} destrava.`]);
 }else if(B.gargalo==='equilibrado'){
  F.push(['grn','Fábrica e montagem equilibradas',`As duas entregam ${m2(B.capEnt)}/mês. Qualquer contratação só aumenta entrega se for dos dois lados.`]);
 }
 if(dP!==0){
  F.push([dLucro>=0?'grn':'org',(dP>0?'Contratar ':'Reduzir ')+Math.abs(dP)+(Math.abs(dP)===1?' pessoa':' pessoas'),
   `A estrutura ${dCusto>0?'sobe':'cai'} ${brl(Math.abs(dCusto))} por mês. A capacidade de entrega vai de ${m2(A.capEnt)} para ${m2(B.capEnt)} e o equilíbrio passa de ${brl(A.peReceita)} para <b>${brl(B.peReceita)}</b> — ${m2(B.peM2)} por mês só para empatar.`]);
 }
 /* a pergunta que o Luka fez: quantos m² cada funcionario precisa produzir para se pagar */
 const realPessoa = B.P>0 ? B.vol/B.P : NaN;
 if(isFinite(B.pePessoa)){
  const sobra=realPessoa-B.pePessoa;
  F.push([sobra>=0?'grn':'red',
   `Com ${nf(B.P,0)} ${B.P===1?'funcionário':'funcionários'} e ${brl(B.estrutura)} de estrutura, você precisa entregar ${m2(B.peM2)} por mês para empatar`,
   `São <b>${m2(B.pePessoa)} por pessoa</b> — é onde a contribuição de ${brl(B.mcM2)} por m² cobre exatamente a estrutura. Hoje cada um entrega ${m2(realPessoa)}: ${sobra>=0?`sobram <b>${m2(sobra)}</b> por pessoa acima do empate`:`faltam <b>${m2(-sobra)}</b> por pessoa, e a empresa opera no prejuízo`}.`]);
 }
 /* a meta e a mesma conta do equilibrio com o lucro desejado somado */
 if(isFinite(B.metaM2)&&B.meta>0){
  const cabe=B.metaFolga>=0;
  F.push([cabe?'blu':'red',`Para ${brl(B.meta)} de lucro por mês: entregar ${m2(B.metaM2)}`,
   `São <b>${m2(B.metaPessoa)} por pessoa</b> e ${brl(B.metaReceita)} de faturamento — ${m2(B.metaM2-B.peM2)} acima do empate. `+
   (cabe?`Cabe na capacidade de ${m2(B.capEnt)}, sobrando ${m2(B.metaFolga)}. Hoje você entrega ${m2(B.vol)}: ${B.vol>=B.metaM2?'a meta já está sendo batida':`faltam <b>${m2(B.metaM2-B.vol)}</b> por mês`}.`
        :`<b>Não cabe:</b> a capacidade é ${m2(B.capEnt)} e faltam ${m2(-B.metaFolga)} que a estrutura atual não produz. Essa meta exige mais gente no gargalo, preço maior ou custo menor — vender mais não resolve.`)]);
 }
 if(isFinite(B.mcM2)&&B.mcM2<=0){
  F.push(['red','Não existe ponto de equilíbrio neste cenário',
   `A margem de contribuição é ${brl(B.mcM2)} por m² — ou seja, cada m² vendido tira dinheiro do caixa. Nenhum volume conserta isso; só preço ou custo.`]);
 }
 /* o pior estado possivel: o volume necessario para empatar nao cabe na fabrica.
    Passa despercebido olhando so o m² por funcionario, que sempre cai quando se
    contrata — o fixo se espalha por mais gente e o alvo individual afrouxa. */
 if(isFinite(B.peM2)&&isFinite(B.capEnt)&&B.peM2>B.capEnt){
  F.push(['red','O ponto de equilíbrio não cabe na sua capacidade',
   `Empatar exige ${m2(B.peM2)}/mês, mas a estrutura só entrega ${m2(B.capEnt)}. <b>Faltam ${m2(B.peM2-B.capEnt)} que não existem</b> — trabalhando no limite, todo mês fecha no vermelho. Não é problema de esforço nem de comercial: com este custo e este preço, empatar é impossível. Sai preço, sai custo, ou sai gente do lado errado.`]);
 }
 if(isFinite(B.lucro)) F.push([dLucro>0?'grn':dLucro<0?'org':'blu','No volume simulado o lucro '+(dLucro>0?'sobe':dLucro<0?'cai':'não muda'),
   `${brl(A.lucro)} → <b>${brl(B.lucro)}</b> (${pc(A.mlPct)} → ${pc(B.mlPct)} de margem líquida). Entregando ${m2(B.vol)} a ${brl(B.preco)}/m².`]);
 if(isFinite(B.folgaCap)&&B.folgaCap<0) F.push(['red','Entregando mais do que a capacidade permite',
   `O cenário entrega ${m2(B.vol)}/mês, mas a capacidade é ${m2(B.capEnt)}. Faltam <b>${m2(-B.folgaCap)}</b> — isso não some, vira atraso, hora extra ou terceirização, e nenhum dos três está neste cálculo.`]);
 else if(isFinite(B.folgaCap)&&B.folgaCap>1) F.push(['yel','Capacidade de entrega sobrando',
   `Você poderia entregar mais ${m2(B.folgaCap)} por mês com a mesma estrutura — ${brl(B.folgaCap*B.preco)} de receita que o comercial não trouxe. O custo dessa capacidade você já paga.`]);
 if(isFinite(B.precoMin)&&B.preco<B.precoMin) F.push(['red','Preço abaixo do mínimo',
   `Você cobra ${brl(B.preco)}/m² e o piso para não dar prejuízo é ${brl(B.precoMin)}. Faltam ${brl(B.precoMin-B.preco)} por m² — entregar mais só aumenta o rombo.`]);
 if(isFinite(B.fatPessoa)&&B.fatPessoa>0){
  const bm=B.fatPessoa<220000?'org':B.fatPessoa<=350000?'grn':'blu';
  F.push([bm,'Faturamento por pessoa: '+brl(B.fatPessoa)+'/ano',
   B.fatPessoa<220000?`Referência de marcenaria sob medida premium é R$ 220 mil a R$ 350 mil por pessoa/ano. Faltam ${brl(220000-B.fatPessoa)} por pessoa para entrar na faixa — é produtividade ou preço, não esforço.`
   :`Dentro da faixa de referência da marcenaria sob medida premium (R$ 220 mil a R$ 350 mil por pessoa/ano).`]);
 }
 if(num(b.imp)+num(b.com)>=1) F.push(['red','Imposto e comissão somam '+pc(num(b.imp)+num(b.com),0),
   'Passando de 100% do preço não existe preço que feche. Confira os percentuais.']);

 el.innerHTML=BLOCOS.map(([titulo,linhas])=>`
 <div class="card">
  <h3>${titulo}</h3>
  <div class="tw"><table>
   <thead><tr><th>Indicador</th><th class="n">Atual</th><th class="n">Simulado</th><th class="n">Diferença</th></tr></thead>
   <tbody>${linhas.map(([l,x,y,t,dir,forte])=>`<tr${forte?' style="font-weight:700"':''}>
     <td${forte?' style="color:var(--accent-light)"':''}>${l}</td><td class="n">${fmt(x,t)}</td>
     <td class="n" style="font-weight:600;color:var(--accent-light)">${fmt(y,t)}</td>
     <td class="n">${delta(x,y,t,dir)}</td></tr>`).join('')}
  </tbody></table></div>
 </div>`).join('')+`
 <div class="card">
  <h3>Leitura</h3>
  ${F.map(([k,t,m])=>`<div class="alert a-${k}"><span class="ic">${k==='red'?'🔴':k==='org'?'🟠':k==='yel'?'🟡':k==='grn'?'🟢':'🔵'}</span><div><b>${t}</b><br><span style="color:var(--text-secondary)">${m}</span></div></div>`).join('')}
 </div>`;
};

VIEWS.kpi=()=>`
 <div class="card">
  <h3>Novo ambiente<span class="hint">o cronograma é gerado sozinho a partir da data de início</span></h3>
  <div class="row">
   <div class="f" style="width:110px"><label>Projeto</label><input id="np" placeholder="089"></div>

  </div>
  <div class="note">Ciclo padrão: 55 dias úteis do caderno técnico aprovado à entrega. Pré-25% 12d · miolo fábrica 25%→75% 15d · pós-75% 7d · obra 21d. Toda data planejada pode ser editada por ambiente.</div>

 <div id="out"></div>`;
PAINT.kpi=()=>{
 if(!DB.amb.length){$('#out').innerHTML='<div class="card"><div class="empty">Nenhum ambiente cadastrado. A unidade de medida é o <b>ambiente completo</b>, nunca o móvel isolado.</div></div>';return}
 const ps=projetos();
 $('#out').innerHTML=`
 <div class="card"><h3>🚦 Painel do projeto<span class="hint">um ambiente laranja derruba o projeto inteiro</span></h3>
  <div class="tw"><table><thead><tr><th>Projeto</th><th>Cliente</th><th>Ambientes</th><th class="n">% planejado</th><th class="n">% real</th><th class="n">Pior ambiente</th><th>Entrega prevista</th><th>Status</th></tr></thead><tbody>
  ${ps.map(p=>{const c={verde:0,amarelo:0,laranja:0,vermelho:0};p.ambientes.forEach(a=>c[ambStatus(a).cor]++);
   return `<tr><td><b>${esc(p.projeto)}</b></td><td>${esc(p.cliente||'—')}</td>
   <td>${Object.entries(c).filter(([,v])=>v).map(([k,v])=>`<span class="tag t-${k}" style="margin-right:3px">${v}</span>`).join('')}</td>
   <td class="n">${nf(p.plan)}%</td><td class="n">${nf(p.real)}%</td>
   <td class="n" style="color:${p.pior>=0?'var(--verde)':'var(--vermelho)'}">${p.pior>0?'+':''}${nf(p.pior)} pts</td>
   <td>${fmtD(p.entrega)}</td><td><span class="tag t-${p.cor}">${p.cor}</span></td></tr>`}).join('')}
  </tbody></table></div>
  <div class="note">Verde = adiantado ou em dia · Amarelo = até 12,5 pts atrás (menos de um marco) · Laranja = até 25 pts · Vermelho = mais de 25 pts atrás. % planejado avança por marco vencido, não linearmente.</div>
 </div>
 ${DB.amb.map((a,i)=>ambCard(a,i)).join('')}`;
};
function ambCard(a,i){
 const s=ambStatus(a),plan=planOf(a),si=stageIdx(a);
 const gate=m=>{const c=MARCOS[m].chk;if(!c)return null;const r=chkPend(a.id,c);return r};
 return `<div class="card">
  <h3>${esc(a.projeto)} — ${esc(a.ambiente)} <span class="tag t-${s.cor}" style="margin-left:6px">${s.cor}</span>
   <span class="hint">${esc(a.cliente||'')} · ${etapaNome(a)} há ${diasNaEtapa(a)} dia(s) · <button class="btn sm dg" onclick="delAmb(${i})">remover</button></span></h3>
  <div class="row" style="margin-bottom:14px;gap:20px">
   <div><div class="mini">% planejado hoje</div><b style="font-size:19px">${nf(s.plan)}%</b></div>
   <div><div class="mini">% real hoje</div><b style="font-size:19px">${nf(s.real)}%</b></div>
   <div><div class="mini">Desvio</div><b style="font-size:19px;color:${s.desvio>=0?'var(--verde)':'var(--vermelho)'}">${s.desvio>0?'+':''}${nf(s.desvio)} pts</b></div>
   <div class="sp" style="min-width:170px"><div class="mini">planejado / real</div>
    <div class="dual"><div class="plan" style="width:${s.plan}%"></div><div class="real" style="width:${s.real}%;background:var(--${s.cor==='verde'?'verde':s.cor==='amarelo'?'amarelo':s.cor==='laranja'?'laranja':'vermelho'})"></div></div></div>
   <div class="f" style="width:150px"><label>Início</label><input type="date" value="${a.inicio||''}" onchange="setAmbInicio(${i},this.value)"></div>
  </div>
  <div class="tw"><table><thead><tr><th style="width:34px"></th><th>Marco</th><th>Critério objetivo</th><th style="width:140px">Planejado</th><th style="width:140px">Real</th><th class="n" style="width:70px">Desvio</th><th>Checklist</th></tr></thead><tbody>
  ${MARCOS.map((m,j)=>{const done=a.real&&a.real[j];const g=gate(j);
   const atras=done&&plan[j]?bizBetween(plan[j],a.real[j]):(!done&&plan[j]&&plan[j]<hoje()?bizBetween(plan[j],hoje()):0);
   return `<tr style="${done?'':j===si+1?'background:rgba(201,168,76,.04)':'opacity:.72'}">
   <td><input type="checkbox" class="ck" ${done?'checked':''} onchange="marcar(${i},${j},this.checked)"></td>
   <td><b>${m.lbl}</b><div class="mini">${m.short}</div></td>
   <td class="mini">${m.crit}</td>
   <td><input type="date" value="${plan[j]||''}" onchange="setPlan(${i},${j},this.value)"></td>
   <td><input type="date" value="${done||''}" onchange="setReal(${i},${j},this.value)"></td>
   <td class="n" style="color:${atras>0?'var(--vermelho)':atras<0?'var(--verde)':'var(--text-muted)'}">${atras?((atras>0?'+':'')+atras+'d'):'—'}</td>
   <td>${g?(g.no?`<span class="tag t-vermelho">${g.no} não OK</span>`:g.pend?`<span class="tag t-amarelo">${g.pend} pend.</span>`:`<span class="tag t-verde">liberado</span>`):'<span class="mini">—</span>'}</td>
   </tr>`}).join('')}
  </tbody></table></div>
 </div>`;
}
function addAmb(){
 const p=$('#np').value.trim(),am=$('#na').value.trim();
 if(!p||!am){alert('Projeto e ambiente são obrigatórios.');return}
 const inicio=$('#ni').value||hoje();
 DB.amb.push({id:uid(),projeto:p,ambiente:am,cliente:$('#nc').value.trim(),inicio,plan:MARCOS.map(m=>addBiz(inicio,m.off)),real:Array(8).fill('')});
 $('#np').value='';$('#na').value='';$('#nc').value='';
 save();render();
}
function delAmb(i){if(!confirm('Remover este ambiente e seus checklists?'))return;const a=DB.amb[i];delete DB.chk[a.id];DB.amb.splice(i,1);save();render()}
function setAmbInicio(i,v){const a=DB.amb[i];a.inicio=v;a.plan=MARCOS.map(m=>addBiz(v,m.off));save();render()}
function setPlan(i,j,v){DB.amb[i].plan[j]=v;save();render()}
function setReal(i,j,v){DB.amb[i].real[j]=v;save();render()}
function marcar(i,j,on){
 const a=DB.amb[i];
 if(on){
  const c=MARCOS[j].chk;
  if(c){const g=chkPend(a.id,c);
   if(g.no&&!confirm(`O checklist de ${CHECKLISTS[c].nome} tem ${g.no} item(ns) marcado(s) como NÃO OK. Avançar mesmo assim?`))return render();
   if(g.pend&&!confirm(`O checklist de ${CHECKLISTS[c].nome} tem ${g.pend} item(ns) sem verificação. Avançar mesmo assim?`))return render();}
  for(let k=0;k<=j;k++)if(!a.real[k])a.real[k]=hoje();
 }else{for(let k=j;k<8;k++)a.real[k]=''}
 save();render();
}

    ${prox?`<div class="m" style="color:${venc?'var(--vermelho)':'var(--text-muted)'}">próx. ${MARCOS[ci].lbl} até ${fmtD(prox)}${venc?' · vencido':''}</div>`:''}
    ${ci<9?`<div style="margin-top:6px;display:flex;gap:4px">${ci>0?`<button class="btn sm" onclick="mover(${i},-1)">◀</button>`:''}${ci<9?`<button class="btn sm" onclick="mover(${i},1)">▶</button>`:''}</div>`:''}
   </div>`}).join('')||'<div class="mini" style="text-align:center;padding:8px;color:#444">—</div>'}</div></div>`).join('')}</div>`
 :'<div class="empty">Cadastre ambientes no KPI 25/50/75/100 — o Kanban se preenche sozinho.</div>'}
 <div class="note">Cada card é um ambiente completo. A cor da borda vem do desvio de cronograma, não do olho de ninguém. Mover o card grava a data real do marco — é a mesma informação que alimenta o KPI, o PCP e o painel.</div>
 </div>
 ${DB.amb.length?`<div class="card"><h3>Ambientes parados</h3>
  <div class="tw"><table><thead><tr><th>Projeto</th><th>Ambiente</th><th>Etapa atual</th><th class="n">Dias parado</th><th>Status</th></tr></thead><tbody>
  ${DB.amb.filter(a=>!ambStatus(a).done).sort((a,b)=>diasNaEtapa(b)-diasNaEtapa(a)).slice(0,12).map(a=>{const s=ambStatus(a),d=diasNaEtapa(a);
   return `<tr><td>${esc(a.projeto)}</td><td>${esc(a.ambiente)}</td><td>${etapaNome(a)}</td><td class="n" style="color:${d>10?'var(--vermelho)':d>6?'var(--laranja)':'inherit'}">${d}</td><td><span class="tag t-${s.cor}">${s.cor}</span></td></tr>`}).join('')}
  </tbody></table></div></div>`:''}`;
};
function mover(i,dir){
 const a=DB.amb[i],s=stageIdx(a);
 if(dir>0){if(s>=7)return;marcar(i,s+1,true)}
 else{if(s<0)return;a.real[s]='';save();render()}
}

/* ---------- PCP ---------- */
VIEWS.pcp=()=>`<div id="out"></div>`;
PAINT.pcp=()=>{
 const ativos=DB.amb.filter(a=>!ambStatus(a).done);
 if(!DB.amb.length){$('#out').innerHTML='<div class="card"><div class="empty">O PCP é derivado dos ambientes. Cadastre no KPI 25/50/75/100.</div></div>';return}
 const etapas=[{lbl:'Pré-25% (Planejamento)',i:-1},...MARCOS.map((m,i)=>({lbl:m.lbl+' — '+m.short,i}))];
 const gg=etapas.map(e=>{
  const l=ativos.filter(a=>stageIdx(a)===e.i);
  const tm=l.length?l.reduce((s,a)=>s+diasNaEtapa(a),0)/l.length:0;
  return{...e,qtd:l.length,tm,lista:l};
 }).filter(e=>e.qtd>0);
 const maxQ=Math.max(...gg.map(g=>g.qtd),1);
 const gargalo=gg.filter(g=>g.qtd>=3||g.tm>10).sort((a,b)=>(b.qtd*b.tm)-(a.qtd*a.tm))[0];
 const fila=[...ativos].sort((a,b)=>{const pa=planOf(a)[7],pb=planOf(b)[7];return (pa||'9')<(pb||'9')?-1:1});
 $('#out').innerHTML=`
 <div class="kpis" style="margin-bottom:16px">
  <div class="kpi neu"><div class="l">Ambientes em produção</div><div class="v">${ativos.length}</div><div class="d">${projetos().length} projeto(s)</div></div>
  <div class="kpi ${fila.filter(a=>planOf(a)[7]<hoje()).length?'bad':'ok'}"><div class="l">Entrega vencida</div><div class="v">${fila.filter(a=>planOf(a)[7]<hoje()).length}</div><div class="d">data de entrega já passou</div></div>
  <div class="kpi ${fila.filter(a=>{const d=bizBetween(hoje(),planOf(a)[7]);return d>=0&&d<=5}).length?'warn':'ok'}"><div class="l">Prazo crítico</div><div class="v">${fila.filter(a=>{const d=bizBetween(hoje(),planOf(a)[7]);return d>=0&&d<=5}).length}</div><div class="d">≤ 5 dias úteis para entregar</div></div>
  <div class="kpi ${gargalo?'bad':'ok'}"><div class="l">Gargalo</div><div class="v" style="font-size:16px;margin-top:9px">${gargalo?gargalo.lbl:'Nenhum'}</div><div class="d">${gargalo?`${gargalo.qtd} ambientes · ${nf(gargalo.tm,1)}d em média`:'fluxo distribuído'}</div></div>
 </div>
 <div class="grid g2">
 <div class="card"><h3>🔴 Onde a produção acumula</h3>
  <div class="tw"><table><thead><tr><th>Etapa</th><th class="n">Ambientes</th><th>Distribuição</th><th class="n">Dias médios parado</th><th>Leitura</th></tr></thead><tbody>
  ${gg.map(g=>{const crit=g.qtd>=3||g.tm>10;
   return `<tr><td>${g.lbl}</td><td class="n">${g.qtd}</td>
   <td><div class="bar" style="min-width:80px"><i style="width:${g.qtd/maxQ*100}%;background:${crit?'var(--vermelho)':'var(--accent)'}"></i></div></td>
   <td class="n" style="color:${g.tm>10?'var(--vermelho)':g.tm>6?'var(--laranja)':'inherit'}">${nf(g.tm,1)}</td>
   <td>${crit?'<span class="tag t-vermelho">gargalo</span>':'<span class="tag t-verde">ok</span>'}</td></tr>`}).join('')}
  </tbody></table></div>

function setChk(id,et,i,v){

function addLead(){

  status:'Lead Novo',etapaMax:0,criado:hoje(),followup:addBiz(hoje(),2),valor:0});
 ['#ln','#lc','#la','#lb'].forEach(s=>$(s).value='');
 save();render();
}
function setStatus(i,v){
 const l=DB.crm[i],idx=idxCRM(v);
 if(idx<6)l.etapaMax=Math.max(l.etapaMax||0,idx);
 l.status=v;
 if(v==='Fechado'&&!l.fechadoEm)l.fechadoEm=hoje();
 if(v!=='Fechado')delete l.fechadoEm;
 save();render();
}

/* ══════════ MODO VITRINE ══════════
   Decisao do Luka: quem nao comprou o app entra, ve o que tem dentro e
   nao consegue colocar numero nenhum. A parede antiga vendia mal — o
   aluno lia "nao esta no seu plano" sem nunca ver a ferramenta.

   Sao duas camadas, e as duas importam:
   1. `save()` desligado (VITRINE=true). Nada vai para o localStorage nem
      para o Supabase. Se algum caminho de edicao escapar do item 2, ele
      morre aqui — e o dado real do aluno, se existir neste navegador,
      nunca e' sobrescrito pelos numeros de exemplo.
   2. Eventos bloqueados na captura, antes de chegarem no handler. E' o
      que o aluno percebe: o campo esta ali, legivel, e nao aceita.

   Nao ha material a proteger aqui: os numeros sao ficticios, os mesmos
   do botao "Dados de exemplo". O que se protege e' o uso da ferramenta.
   Nada disso substitui o gate: `temFerramentas()` continua falhando
   fechado, e quem compra e' liberado em `acesso.ferramentas`. */
function modoVitrine(){
 VITRINE=true;
 REMOTO=false;SYNC='vitrine';
 /* De exemplo, em memoria. Nao passa por save() — ver camada 1. */
 DB=exemploDB();
 document.body.classList.add('vit');
 iniciarUI();
 faixaVitrine();
 travarVitrine();
}
function faixaVitrine(){
 const c=$('#content');if(!c)return;
 c.insertAdjacentHTML('beforebegin',`
 <div class="vitfx">
  <div style="flex:1;min-width:230px;">
   <div class="vitfx-t">Modo demonstração — você está vendo o app por dentro</div>
   <div class="vitfx-s">Os números na tela são de exemplo e os campos estão travados.
    Com o acesso liberado, você lança os seus e o app devolve diagnóstico, semáforo e o que fazer hoje.</div>
  </div>
  <a class="vb" data-vitrine-livre href="${ctaHref('Quero meu acesso ao app de ferramentas da mentoria APM')}" target="_blank" rel="noopener">Quero meu acesso</a>
 </div>`);
 /* Exportar/Importar/Dados de exemplo nao fazem sentido em vitrine:
    exportariam dado ficticio e importar nao gravaria nada. */
 const tbr=document.querySelector('.tbr');
 if(tbr)tbr.innerHTML=`<span style="font-size:10.5px;color:var(--accent-light);border:1px solid rgba(201,168,76,.42);background:rgba(201,168,76,.13);padding:4px 9px;border-radius:4px;letter-spacing:.6px;text-transform:uppercase;font-weight:700;">Demonstração</span>`;
}
/* Captura (terceiro argumento `true`): o evento e' cortado antes de
   chegar no `onclick` do elemento, entao nao ha handler para revisar um
   por um — nem os que ainda vao ser escritos.
   O que continua livre: a navegacao (`#nav`), o rodape com "Sair da
   conta", e qualquer coisa marcada `data-vitrine-livre` (o botao de
   comprar). Bloqueado: tudo que e' campo ou botao dentro de `#content`. */
const AVISA={pointerdown:1,mousedown:1,click:1,dblclick:1,keydown:1,paste:1};
function travarVitrine(){
 const bloquear=ev=>{
  const el=ev.target;
  if(!el||!el.closest)return;
  if(el.closest('[data-vitrine-livre]'))return;
  if(!el.closest('#content'))return;
  if(!el.closest('input,select,textarea,button,label,[onclick],[contenteditable]'))return;
  ev.preventDefault();ev.stopPropagation();
  /* O aviso sai no gesto do aluno, nao nos eventos que seriam
     consequencia dele (`focusin`, `input`, `change`) — senao um clique
     unico piscaria o aviso tres vezes. */
  if(AVISA[ev.type])avisoVitrine();
 };
 ['pointerdown','mousedown','click','dblclick','keydown','paste','input','change','focusin']
  .forEach(t=>document.addEventListener(t,bloquear,true));
}
let vittmr=null;
function avisoVitrine(){
 let t=$('#vittoast');
 if(!t){
  document.body.insertAdjacentHTML('beforeend',`
  <div class="vittoast" id="vittoast">

    dá para ver tudo o que o app faz, mas lançar os seus números precisa do acesso liberado.</div>
   <a data-vitrine-livre href="${ctaHref('Quero meu acesso ao app de ferramentas da mentoria APM')}" target="_blank" rel="noopener">Liberar</a>
  </div>`);
  t=$('#vittoast');
 }
 clearTimeout(vittmr);
 vittmr=setTimeout(()=>{const e=$('#vittoast');if(e)e.remove()},5200);
}

 location.reload();
}

/* ══════════ BOOT ══════════ */
function iniciarUI(){
 renderNav();
 VIEW=(location.hash||'').replace('#','')||'painel';
 if(!NAV.some(n=>n.id===VIEW))VIEW='painel';
 render();rodape();
 window.addEventListener('hashchange',()=>{const v=location.hash.replace('#','');if(v&&v!==VIEW&&NAV.some(n=>n.id===v)){VIEW=v;render()}});
}
(async function boot(){
 if(!configurado()){SYNC='local';iniciarUI();return}
 if(!window.supabase){
  SYNC='bad';iniciarUI();
  alert('Não foi possível carregar a biblioteca de sincronização. O app segue funcionando, salvando só neste navegador.');
  return;
 }
 sb=window.supabase.createClient(CFG.url,CFG.anon);
 let sess=null;
 try{ sess=(await sb.auth.getSession()).data.session }catch(e){ console.error(e) }
 if(!sess){telaLogin();return}
 USER=sess.user;REMOTO=true;
 const acc=await temFerramentas();
 /* Duas saidas diferentes para dois problemas diferentes. `infra` e'
    banco fora do ar: nao ha nada a demonstrar nem a vender, e mostrar
    numeros de exemplo ali faria o aluno achar que comprou. Sem `infra`
    e' aluno que nao comprou — esse entra e olha por dentro. */
 if(!acc.ok){
  if(acc.infra){telaSemAcesso(acc.infra);return}
  modoVitrine();return;
 }
 try{ await puxar() }
 catch(e){ SYNC='bad';console.error('load',e);
   alert('Entrou, mas não consegui carregar seus dados do servidor. Usando o que está neste navegador. Se o problema persistir, confira se a tabela e as políticas de acesso foram criadas.') }
 iniciarUI();
 sb.auth.onAuthStateChange((ev)=>{if(ev==='SIGNED_OUT')location.reload()});
})();
</script>
